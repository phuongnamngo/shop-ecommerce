<section aria-labelledby="layout-title" style="font-family: system-ui, sans-serif; max-width: 1100px; margin: 0 auto; padding: 1.5rem; color: #0f172a;">
  <header style="margin-bottom: 1.25rem;">
    <p style="margin: 0 0 0.25rem; font-size: 0.75rem; letter-spacing: 0.06em; text-transform: uppercase; color: #64748b;">Watch — Admin shell</p>
    <h1 id="layout-title" style="margin: 0 0 0.5rem; font-size: 1.5rem;">Chọn layout backoffice</h1>
    <p style="margin: 0; color: #475569; line-height: 1.5;">Change <code>web-admin-panel</code>: login sau đó vào vùng protected. Menu theo role; module chưa làm là stub. Click một card để chọn.</p>
  </header>

  <div style="display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));">
    <button
      type="button"
      data-choice="sidebar"
      aria-label="Chọn layout sidebar trái"
      style="text-align: left; cursor: pointer; border: 2px solid #0f172a; border-radius: 12px; padding: 1rem; background: #fff; box-shadow: 0 1px 2px rgb(15 23 42 / 8%);"
    >
      <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 0.5rem; margin-bottom: 0.75rem;">
        <strong style="font-size: 1.05rem;">A — Sidebar trái (Recommended)</strong>
        <span style="font-size: 0.7rem; font-weight: 600; background: #0f172a; color: #fff; padding: 0.15rem 0.45rem; border-radius: 999px;">Rec</span>
      </div>
      <p style="margin: 0 0 0.85rem; font-size: 0.875rem; color: #475569; line-height: 1.45;">Cột trái cố định: brand + nav. Top bar mỏng: user + logout. Phù hợp nhiều module Catalog / Orders / Inventory.</p>
      <div aria-hidden="true" style="display: grid; grid-template-columns: 72px 1fr; grid-template-rows: 28px 1fr; height: 160px; border: 1px solid #cbd5e1; border-radius: 8px; overflow: hidden; background: #f8fafc;">
        <div style="grid-row: 1 / -1; background: #1e293b; color: #e2e8f0; padding: 0.4rem; font-size: 0.55rem; line-height: 1.35;">
          <div style="font-weight: 700; margin-bottom: 0.5rem; color: #fff;">Watch</div>
          <div style="opacity: 0.95;">Dashboard</div>
          <div style="opacity: 0.7;">Catalog</div>
          <div style="opacity: 0.7;">Orders</div>
          <div style="opacity: 0.7;">Customers</div>
          <div style="opacity: 0.7;">Inventory</div>
        </div>
        <div style="background: #fff; border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: flex-end; padding: 0 0.5rem; font-size: 0.55rem; color: #64748b;">admin@watch · Logout</div>
        <div style="padding: 0.6rem; font-size: 0.65rem; color: #334155;">
          <div style="font-weight: 600; margin-bottom: 0.35rem;">Dashboard</div>
          <div style="height: 48px; border: 1px dashed #cbd5e1; border-radius: 6px; display: grid; place-items: center; color: #94a3b8;">placeholder</div>
        </div>
      </div>
      <ul style="margin: 0.85rem 0 0; padding-left: 1.1rem; font-size: 0.8rem; color: #334155; line-height: 1.45;">
        <li>Ưu: scale khi thêm CRUD; menu role rõ; pattern shadcn Sidebar phổ biến</li>
        <li>Nhược: chiếm chiều ngang trên màn hẹp (cần collapse mobile)</li>
      </ul>
    </button>

    <button
      type="button"
      data-choice="topnav"
      aria-label="Chọn layout top navigation"
      style="text-align: left; cursor: pointer; border: 2px solid #e2e8f0; border-radius: 12px; padding: 1rem; background: #fff;"
    >
      <div style="margin-bottom: 0.75rem;">
        <strong style="font-size: 1.05rem;">B — Top navigation</strong>
      </div>
      <p style="margin: 0 0 0.85rem; font-size: 0.875rem; color: #475569; line-height: 1.45;">Một thanh trên: logo + links ngang + user. Content full-width. Gọn khi ít mục; dễ chật khi Catalog tách nhiều subpage.</p>
      <div aria-hidden="true" style="display: grid; grid-template-rows: 36px 1fr; height: 160px; border: 1px solid #cbd5e1; border-radius: 8px; overflow: hidden; background: #f8fafc;">
        <div style="background: #1e293b; color: #e2e8f0; display: flex; align-items: center; gap: 0.55rem; padding: 0 0.55rem; font-size: 0.55rem;">
          <strong style="color: #fff;">Watch</strong>
          <span>Dashboard</span>
          <span style="opacity: 0.7;">Catalog</span>
          <span style="opacity: 0.7;">Orders</span>
          <span style="opacity: 0.7;">…</span>
          <span style="margin-left: auto; opacity: 0.85;">Logout</span>
        </div>
        <div style="padding: 0.6rem; font-size: 0.65rem; color: #334155;">
          <div style="font-weight: 600; margin-bottom: 0.35rem;">Dashboard</div>
          <div style="height: 72px; border: 1px dashed #cbd5e1; border-radius: 6px; display: grid; place-items: center; color: #94a3b8;">placeholder</div>
        </div>
      </div>
      <ul style="margin: 0.85rem 0 0; padding-left: 1.1rem; font-size: 0.8rem; color: #334155; line-height: 1.45;">
        <li>Ưu: tối đa diện tích content; implement nhanh</li>
        <li>Nhược: submenu Catalog/Inventory khó; kém scale hơn sidebar</li>
      </ul>
    </button>
  </div>
</section>
