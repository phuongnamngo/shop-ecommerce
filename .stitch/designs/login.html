<!DOCTYPE html><html lang="en" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Sign In - TailwindAdmin</title>
<!-- Google Fonts: Plus Jakarta Sans -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&amp;display=swap" rel="stylesheet">
<!-- Material Symbols Outlined -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#ecf2ff',
              100: '#dbe1ff',
              400: '#5d87ff',
              500: '#4379ee',
              600: '#1f53c9',
            },
            darkBg: '#192231',
            darkCard: '#212b3b',
            darkInput: '#182232',
            darkBorder: '#2d3748',
          }
        },
      },
    }
  </script>
<style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      vertical-align: middle;
      line-height: 1;
    }
    .custom-glow-shadow {
      box-shadow: 0 20px 45px -10px rgba(7, 13, 23, 0.65), 0 0 0 1px rgba(255, 255, 255, 0.05);
    }
  </style>
</head>
<body class="bg-[#192231] text-slate-200 antialiased min-h-screen flex flex-col items-center justify-center p-4 sm:p-6 relative selection:bg-brand-500 selection:text-white">
<!-- Subtle ambient background glow -->
<div class="fixed top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[520px] h-[520px] bg-brand-500/10 rounded-full blur-3xl pointer-events-none -z-10"></div>
<!-- Central Login Card Container -->
<div class="w-full max-w-[460px] bg-[#212b3b] rounded-2xl p-7 sm:p-9 border border-slate-700/60 custom-glow-shadow relative z-10">
<!-- Brand Header -->
<div class="flex items-center justify-center gap-3 mb-8">
<!-- Modern circular gradient ring logo -->
<div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-500 to-cyan-400 p-[2px] flex items-center justify-center shadow-lg shadow-brand-500/20">
<div class="w-full h-full bg-[#212b3b] rounded-[10px] flex items-center justify-center">
<span class="material-symbols-outlined text-brand-400 text-[22px]" style="font-variation-settings: 'FILL' 1;">widgets</span>
</div>
</div>
<span class="text-2xl font-bold tracking-tight text-white">Tailwindadmin</span>
</div>
<!-- Social Authentication Buttons -->
<div class="grid grid-cols-2 gap-3.5 mb-7">
<!-- Google Sign In -->
<button class="h-11 px-4 rounded-xl border border-slate-700/80 bg-[#1b2433] hover:bg-[#253245] hover:border-slate-600 active:scale-[0.98] text-white font-medium text-sm flex items-center justify-center gap-2.5 transition-all duration-150 shadow-sm" type="button">
<svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"></path>
</svg>
<span class="">Google</span>
</button>
<!-- Facebook Sign In -->
<button class="h-11 px-4 rounded-xl border border-slate-700/80 bg-[#1b2433] hover:bg-[#253245] hover:border-slate-600 active:scale-[0.98] text-white font-medium text-sm flex items-center justify-center gap-2.5 transition-all duration-150 shadow-sm" type="button">
<svg class="w-4 h-4 text-[#1877F2] shrink-0 fill-current" viewBox="0 0 24 24">
<path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"></path>
</svg>
<span class="">Facebook</span>
</button>
</div>
<!-- Divider -->
<div class="relative flex items-center justify-center mb-6">
<div class="w-full border-t border-slate-700/70"></div>
<span class="absolute bg-[#212b3b] px-3.5 text-xs text-slate-400 font-medium">or sign in with</span>
</div>
<!-- Form Section -->
<form class="space-y-4" onsubmit="event.preventDefault();">
<!-- Username / Work Email -->
<div>
<label class="block text-sm font-semibold text-slate-200 mb-1.5" for="username">
          Username
        </label>
<input class="w-full h-11 px-4 rounded-xl border border-slate-700/80 bg-[#182232] text-white placeholder:text-slate-500 focus:outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 text-sm transition-all" id="username" placeholder="admin" required="" type="text">
</div>
<!-- Password -->
<div>
<label class="block text-sm font-semibold text-slate-200 mb-1.5" for="password">
          Password
        </label>
<input class="w-full h-11 px-4 rounded-xl border border-slate-700/80 bg-[#182232] text-white placeholder:text-slate-500 focus:outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 text-sm transition-all tracking-wider" id="password" placeholder="••••••••••••" required="" type="password">
</div>
<!-- Remember & Forgot Password -->
<div class="flex items-center justify-between pt-1 text-sm">
<label class="flex items-center gap-2.5 cursor-pointer select-none group">
<input checked="" class="w-4 h-4 rounded border-slate-600 bg-[#182232] text-brand-500 focus:ring-offset-0 focus:ring-1 focus:ring-brand-500 transition cursor-pointer" type="checkbox">
<span class="text-slate-300 text-xs sm:text-sm group-hover:text-white transition-colors">Remember this Device</span>
</label>
<a class="text-brand-400 hover:text-brand-300 font-semibold text-xs sm:text-sm transition-colors" href="#">
          Forgot Password ?
        </a>
</div>
<!-- Primary Action CTA -->
<button class="w-full h-11 mt-4 bg-brand-500 hover:bg-brand-400 active:scale-[0.99] text-white font-semibold rounded-xl text-sm shadow-md shadow-brand-500/25 transition-all duration-150 flex items-center justify-center" type="submit">
        Sign in
      </button>
</form>
<!-- Footer Register CTA inside card -->

</div>
</body></html>
